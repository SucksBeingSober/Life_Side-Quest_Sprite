<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>人生支线小精灵</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div class="scene">
      <div class="bubble" id="bubble" aria-live="polite">
        <p id="bubbleText"></p>
      </div>

      <div class="pet" id="pet" title="拖我走，双击开面板">
        <div class="shadow"></div>
        <div class="flip" id="flip">
          <svg class="pet-svg" viewBox="0 0 128 128" aria-hidden="true">
            <defs>
              <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFF3DA" />
                <stop offset="100%" stop-color="#FFD49A" />
              </linearGradient>
              <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#F0653F" stop-opacity="0.45" />
                <stop offset="100%" stop-color="#F0653F" stop-opacity="0" />
              </radialGradient>
            </defs>

            <ellipse class="foot foot-l" cx="48" cy="110" rx="9" ry="5.4" fill="#FFD49A" stroke="#2A2520" stroke-width="3" />
            <ellipse class="foot foot-r" cx="80" cy="110" rx="9" ry="5.4" fill="#FFD49A" stroke="#2A2520" stroke-width="3" />

            <circle cx="64" cy="17" r="12" fill="url(#glowGrad)" class="antenna-glow" />
            <path d="M64 38 L64 22" stroke="#2A2520" stroke-width="3" stroke-linecap="round" />
            <circle cx="64" cy="18" r="4.6" fill="#F0653F" />

            <ellipse cx="25" cy="80" rx="6.5" ry="9" fill="#FFD49A" stroke="#2A2520" stroke-width="3" transform="rotate(-16 25 80)" />
            <ellipse cx="103" cy="80" rx="6.5" ry="9" fill="#FFD49A" stroke="#2A2520" stroke-width="3" transform="rotate(16 103 80)" />

            <path
              d="M64 36 C90 36 103 55 103 77 C103 97 88 109 64 109 C40 109 25 97 25 77 C25 55 38 36 64 36 Z"
              fill="url(#bodyGrad)"
              stroke="#2A2520"
              stroke-width="3"
            />

            <ellipse cx="39" cy="82" rx="6.5" ry="3.6" fill="#F0836A" opacity="0.45" />
            <ellipse cx="89" cy="82" rx="6.5" ry="3.6" fill="#F0836A" opacity="0.45" />

            <g class="eyes">
              <ellipse cx="49" cy="70" rx="5.4" ry="6.6" fill="#2A2520" />
              <ellipse cx="79" cy="70" rx="5.4" ry="6.6" fill="#2A2520" />
              <circle cx="51.2" cy="67.4" r="1.8" fill="#FFFFFF" />
              <circle cx="81.2" cy="67.4" r="1.8" fill="#FFFFFF" />
            </g>

            <path d="M58 84 Q64 89 70 84" stroke="#2A2520" stroke-width="3.2" fill="none" stroke-linecap="round" />

            <g class="sparkles">
              <path d="M22 38 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z" fill="#F0B24B" />
              <path d="M108 30 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2 z" fill="#F0B24B" opacity="0.7" />
            </g>
          </svg>
        </div>
      </div>
    </div>

    <script src="pet.js"></script>
  </body>
</html>
